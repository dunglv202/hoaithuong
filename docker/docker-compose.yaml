services:
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template
    ports:
      - "80:80"
    restart: always

  db:
    image: mysql:8.4.0
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    restart: always

  adminer:
    image: adminer
    environment:
      - ADMINER_DEFAULT_SERVER=db
    restart: always

  backend:
    image: dunglv202/hoaithuong-be
    build:
      context: ../backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=hoai_thuong
    volumes:
      - ./application.yaml:/usr/sqa/backend/application.yaml:ro
    restart: always
    depends_on:
      - db

  frontend:
    image: dunglv202/hoaithuong-fe
    build:
      context: ../frontend
    restart: always

volumes:
  db_data:
