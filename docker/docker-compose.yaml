services:
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template
    ports:
      - "80:80"
    restart: always

  db:
    image: mysql:8.4.0
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hoai_thuong
    restart: always

  adminer:
    image: adminer
    environment:
      - ADMINER_DEFAULT_SERVER=db
    ports:
      - "81:8080"
    restart: always

  backend:
    image: dunglv202/hoaithuong-be
    build:
      context: ../backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=hoai_thuong
      - JAVA_OPTS=${JAVA_OPTS}
    ports:
      - "5005:5005"
    volumes:
      - ./application.yaml:/usr/sqa/backend/config/application.yaml:ro
    restart: always
    depends_on:
      - db
      - minio

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=1ceJTxzGTuesjBgcERz5hKLgOJpOGbrdR
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  frontend:
    image: dunglv202/hoaithuong-fe
    build:
      context: ../frontend
    restart: always

volumes:
  db_data:
  minio_data:
